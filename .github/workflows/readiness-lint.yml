name: Agent-readiness lint

# The linter is advisory. It must never be the reason an issue looks broken, so
# every step below is written to fail open: missing secrets, model outages and
# API errors all end in a clean exit rather than a red X on someone's issue.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to (re-)score
        required: true
        type: string
      force:
        description: Score even if a skip label is present
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# An edit-storm should not queue five scoring runs and burn tokens on
# intermediate drafts. Keep only the newest run per issue.
concurrency:
  group: readiness-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  score:
    name: Score issue readiness
    runs-on: ubuntu-latest
    # Bots opening issues would otherwise trigger the linter on their own output.
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.type != 'Bot'
    steps:
      - name: Check whether a model backend is configured
        id: guard
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          if [ -n "$OPENAI_KEY" ] || { [ -n "$AZURE_KEY" ] && [ -n "$AZURE_ENDPOINT" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No model backend configured (OPENAI_API_KEY or AZURE_OPENAI_*) - skipping readiness lint. See README."
          fi

      - name: Check out the engine
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # When installed into a playground repo this pulls the engine from the
          # code repo, so there is exactly one source of truth for the rubric.
          repository: ${{ vars.DISPATCH_ENGINE_REPO || github.repository }}
          ref: ${{ vars.DISPATCH_ENGINE_REF || '' }}

      - name: Set up Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      # @dispatch/core resolves to dist/, so tsx cannot load it from source.
      # Without this the CLI dies with ERR_MODULE_NOT_FOUND before it ever
      # reaches the model.
      - name: Build the engine
        if: steps.guard.outputs.ready == 'true'
        run: npm run build

      - name: Score and comment
        id: score
        if: steps.guard.outputs.ready == 'true'
        # Advisory means advisory: a model outage must not surface as a failed
        # check on a contributor's issue.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-10-21' }}
          MODEL_SCORE: ${{ vars.MODEL_SCORE || 'gpt-4o-mini' }}
          MODEL_DECOMPOSE: ${{ vars.MODEL_DECOMPOSE || 'gpt-4o' }}
          MODEL_CLASSIFY: ${{ vars.MODEL_CLASSIFY || 'gpt-4o' }}
          TARGET_REPO: ${{ github.event.repository.full_name || github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS="--repo $TARGET_REPO --issue $ISSUE_NUMBER --post"
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          # Capture stderr too. With stdout only, a crash left an empty log and
          # the summary below reported nothing while the job stayed green.
          npx tsx packages/cli/src/lint.ts $ARGS 2>&1 | tee "$RUNNER_TEMP/lint.log"

      - name: Summarise
        if: always() && steps.guard.outputs.ready == 'true'
        env:
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          {
            echo "### Agent-readiness lint"
            echo ""
            # continue-on-error keeps a model outage off a contributor's issue,
            # but it also hides genuine breakage behind a green check. Say so.
            if [ "$SCORE_OUTCOME" != "success" ]; then
              echo "**The scoring step failed and no comment was posted.**"
              echo "The check is green on purpose — this linter never blocks an issue."
              echo ""
            fi
            if [ -s "$RUNNER_TEMP/lint.log" ]; then
              echo '```'
              head -c 8000 "$RUNNER_TEMP/lint.log"
              echo '```'
            else
              echo "No output captured - the scoring step did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCORE_OUTCOME" != "success" ]; then
            echo "::warning::Readiness scoring failed; see the run summary. No comment was posted."
          fi
